name: Programador Automático de Facebook Multi-Página

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas para revisar comentarios, actualizar métricas y programar contenido
    - cron: '0 0,4,8,12,16,20 * * *'
  # Permite ejecución manual en cualquier momento desde la pestaña "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🚀 Publicador Automático Multi-Página (Huellas & Metalidad de Acero)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          META_ACCESS_TOKEN_ACERO: ${{ secrets.META_ACCESS_TOKEN_ACERO }}
          PAGE_ID_ACERO: ${{ secrets.PAGE_ID_ACERO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node publicador.js

      - name: 🤖 Community Manager IA Multi-Página (Respuestas Inteligentes a Comentarios)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          META_ACCESS_TOKEN_ACERO: ${{ secrets.META_ACCESS_TOKEN_ACERO }}
          PAGE_ID_ACERO: ${{ secrets.PAGE_ID_ACERO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node respondedor_comentarios.js

      - name: 📊 Extractor de Métricas Multi-Página (Dashboard)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          META_ACCESS_TOKEN_ACERO: ${{ secrets.META_ACCESS_TOKEN_ACERO }}
          PAGE_ID_ACERO: ${{ secrets.PAGE_ID_ACERO }}
        run: node metricas.js

      - name: 💾 Guardar estado actualizado en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática: cola de publicaciones, métricas e historial [skip ci]"
          file_pattern: "noviembre/publicaciones.json mentalidad_de_acero/publicaciones.json metricas.json historial_comentarios.json"
